name: Demo check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile demo and tests
        run: |
          python -m py_compile examples/synthetic_demo.py
          python -m py_compile tests/test_demo.py

      - name: Run behavior tests
        run: python -m unittest discover -s tests -v

      - name: Verify expected outputs
        run: |
          test -s output/synthetic_sensor_data.csv
          test -s output/risk_summary.csv
